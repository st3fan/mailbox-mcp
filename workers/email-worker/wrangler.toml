name = "mailbox-mcp-email-worker"
main = "src/index.ts"
compatibility_date = "2025-10-01"

# A catch-all Email Routing rule ("Send to a Worker" → this worker, configured
# once in the dashboard) routes every address on the domain here; the mailbox
# registry decides which addresses we handle. The stored mail lives in the
# MAILBOX_STORE R2 bucket, shared with the MCP worker.

[[r2_buckets]]
binding = "MAILBOX_STORE"
bucket_name = "mailbox-mcp-mailbox-store"

# Mailbox registry, shared with workers/mcp. Create the database once, then
# paste its ID here (see workers/mcp/wrangler.toml):
[[d1_databases]]
binding = "REGISTRY"
database_name = "mailbox-registry"
database_id = "REPLACE_AFTER_D1_CREATE"