name = "mailbox-mcp-email-worker"
main = "src/index.ts"
compatibility_date = "2025-10-01"

# Email Routing rules created by mailbox-mcp route mail for individual mailbox
# addresses to this worker; no catch-all is used.
# The stored mail is read back through the messages API worker (see
# ../messages-api), which binds to the same bucket.

[[r2_buckets]]
binding = "MAILBOX_STORE"
bucket_name = "mailbox-mcp-mailbox-store"