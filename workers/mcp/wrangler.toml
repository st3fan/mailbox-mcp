name = "mailbox-mcp"
main = "src/index.ts"
compatibility_date = "2025-10-01"

# The consolidated Worker serves streamable HTTP at /mcp (fetch handler) and
# ingests mail (email handler): it owns the mailbox registry (MAILBOX_MCP_REGISTRY D1
# database) and message storage (the MAILBOX_MCP_STORE R2 binding).
#
# Secrets (set once with wrangler secret put <NAME>):
#   MAILBOX_MCP_BEARER_TOKEN        bearer token MCP clients must present
#
# Exposing the endpoint beyond localhost-style use is an operator decision:
# every client that can reach /mcp with the token can manage mailboxes and
# read stored mail.

[vars]
MAILBOX_MCP_DOMAIN = "example.com"

[[r2_buckets]]
binding = "MAILBOX_MCP_STORE"
bucket_name = "mailbox-mcp-store"

# Mailbox registry. Fresh installs: either let the Deploy to Cloudflare
# button provision the database (it rewrites this placeholder), or create it
# yourself and paste its ID here:
#   npx wrangler d1 create mailbox-mcp-registry
#   npx wrangler d1 migrations apply MAILBOX_MCP_REGISTRY --remote
[[d1_databases]]
binding = "MAILBOX_MCP_REGISTRY"
database_name = "mailbox-mcp-registry"
database_id = "REPLACE_AFTER_D1_CREATE"
migrations_dir = "migrations"