name = "mailbox-mcp"
main = "src/index.ts"
compatibility_date = "2025-10-01"

# The consolidated Worker serves streamable HTTP at /mcp (fetch handler) and
# ingests mail (email handler): it owns the mailbox registry (REGISTRY D1
# database) and message storage (the MAILBOX_STORE R2 binding).
#
# Secrets (set once with wrangler secret put <NAME>):
#   MCP_AUTH_TOKEN        bearer token MCP clients must present
#
# Exposing the endpoint beyond localhost-style use is an operator decision:
# every client that can reach /mcp with the token can manage mailboxes and
# read stored mail.

[vars]
DOMAIN = "outofscope.party"

[[r2_buckets]]
binding = "MAILBOX_STORE"
bucket_name = "mailbox-mcp-mailbox-store"

# Mailbox registry. Create the database once, then paste its ID here:
#   npx wrangler d1 create mailbox-registry
#   npx wrangler d1 migrations apply mailbox-registry
[[d1_databases]]
binding = "REGISTRY"
database_name = "mailbox-registry"
database_id = "1326f8ce-a528-4d3c-be63-1e04a4fe9886"
migrations_dir = "migrations"